[project]
name = "datastore360"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ABD ELHAFID AZLIGUE", email = "abdelhafidazligue162@gmail.com" }
]
requires-python = ">=3.10, <3.14"
dependencies = [
    "fg-data-profiling>=4.20.0",
    "jupyter>=1.1.1",
    "matplotlib<=3.10",
    "numpy<2.4",
    "pandas<3",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "seaborn",
    "setuptools<70",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
datastore360 = "datastore360:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
